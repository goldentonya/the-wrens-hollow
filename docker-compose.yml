services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress_root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/themes/wrens-hollow:/var/www/html/wp-content/themes/wrens-hollow
      - ./site/images:/var/www/html/wp-content/themes/wrens-hollow/images:ro

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
      - db
    # Run as uid 33 so files this container writes into the shared volume
    # (WooCommerce plugin files, etc.) match the www-data user the wordpress
    # image (Debian) uses — otherwise the plugin install can't write to wp-content.
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/themes/wrens-hollow:/var/www/html/wp-content/themes/wrens-hollow
      - ./wordpress/wp-cli:/wp-cli-scripts:ro
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    entrypoint: ["sh", "/wp-cli-scripts/init.sh"]

volumes:
  db_data:
  wp_data:
